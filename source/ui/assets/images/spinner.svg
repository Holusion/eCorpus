<svg viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!--
    Voyager's loader (sv-spinner) with Voyager's upstream, drawn as the app's <circle-loader> (see ui/styles/loaders.scss).
    Our fork shows a <cube-loader> instead. In an <object>: the page's colors don't get here, so it's in the default primary color.
  -->
  <style>
    path {
      fill: none;
      stroke: #e6b900;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 12px 12px;
      animation: spin 1.25s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; }
    }
  </style>
  <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
</svg>
