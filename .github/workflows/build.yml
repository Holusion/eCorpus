
name: Build & Deploy

on:
  push:
    branches: ["gh_pages"]
  pull_request:
    branches: ["gh_pages"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20 #fetch the last 20 commits to get mtimes from
          lfs: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: restore files mtime
        run: |
          sudo apt -qqy update
          sudo apt -qqy install git-restore-mtime
          git restore-mtime
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # Checks internes (liens relatifs, ancres, images, alt) : bloquants et déterministes.
      - name: test HTML validity
        run: >
          bundle exec htmlproofer _site/
          --no-enforce-https
          --allow-missing-href
          --swap-urls "^https?\:\/\/ecorpus\.eu:"
          --ignore-status-codes "403,412,429"
          --ignore-urls "/fonts\.googleapis\.com/,/fonts\.gstatic\.com/,/^https?:\/\/localhost/,/threejs\.org\/docs/,/expressjs\.com/"
          --disable-external
          --log-level :debug
      # Liens externes : dépendants du réseau des runners (blocages, timeouts), donc
      # non bloquants. Le détail part dans le résumé du job, lisible sans les logs.
      - name: check external links (non-blocking)
        continue-on-error: true
        run: |
          set +e
          bundle exec htmlproofer _site/ \
            --no-enforce-https \
            --allow-missing-href \
            --swap-urls "^https?\:\/\/ecorpus\.eu:" \
            --ignore-status-codes "403,412,429" \
            --ignore-urls "/fonts\.googleapis\.com/,/fonts\.gstatic\.com/,/^https?:\/\/localhost/,/threejs\.org\/docs/,/expressjs\.com/" \
            --typhoeus '{"timeout":60,"connecttimeout":20}' \
            --log-level :info > external-links.log 2>&1
          status=$?
          echo "htmlproofer exit code: ${status}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "check, the following failures|^\* At|External link|failed" external-links.log | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload artifact
        if: ${{ github.ref == 'refs/heads/gh_pages' }}
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    if: ${{ github.ref == 'refs/heads/gh_pages' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
