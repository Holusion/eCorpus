name: Validate OpenAPI

on:
  push:
    paths:
      - "_data/openapi.yml"
      - "redocly.yaml"
  pull_request:
    paths:
      - "_data/openapi.yml"
      - "redocly.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint OpenAPI description
        run: npx --yes @redocly/cli@latest lint --format=github-actions
